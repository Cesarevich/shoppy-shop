doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '17'
        profiling_collect_backtrace: '%kernel.debug%'
        types:
            product_id: App\Catalog\Product\Infrastructure\Persistence\Doctrine\Type\ProductIdType
            product_title: App\Catalog\Product\Infrastructure\Persistence\Doctrine\Type\ProductTitleType
            ean: App\Catalog\Product\Infrastructure\Persistence\Doctrine\Type\EanType
            product_description: App\Catalog\Product\Infrastructure\Persistence\Doctrine\Type\ProductDescriptionType
            product_year: App\Catalog\Product\Infrastructure\Persistence\Doctrine\Type\ProductYearType
            type_id: App\Catalog\Type\Infrastructure\Persistence\Doctrine\Type\TypeIdType
            type_code: App\Catalog\Type\Infrastructure\Persistence\Doctrine\Type\TypeCodeType
            type_title: App\Catalog\Type\Infrastructure\Persistence\Doctrine\Type\TypeTitleType
            category_id: App\Catalog\Category\Infrastructure\Persistence\Doctrine\Type\CategoryIdType
            category_title: App\Catalog\Category\Infrastructure\Persistence\Doctrine\Type\CategoryTitleType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            CatalogProduct:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Product/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Catalog\Product\Domain'
                alias: CatalogProduct
            CatalogType:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Type/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Catalog\Type\Domain'
                alias: CatalogType
            CatalogProductHistory:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/ProductHistory/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Catalog\ProductHistory\Domain'
                alias: CatalogProductHistory
            CatalogCategory:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Category/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Catalog\Category\Domain'
                alias: CatalogCategory

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
