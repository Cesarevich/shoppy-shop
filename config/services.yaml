# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Shared\Domain\Bus\Command\CommandHandler:
            tags: ['app.command_handler']
        App\Shared\Domain\Bus\Query\QueryHandler:
            tags: ['app.query_handler']
        App\Shared\Domain\Bus\Event\DomainEventSubscriber:
            tags: ['app.domain_event_subscriber']

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Catalog/Product/Domain/'
            - '../src/Shared/Domain/'

    App\Shared\Infrastructure\Bus\Command\InMemoryCommandBus:
        arguments:
            $commandHandlers: !tagged_iterator app.command_handler

    App\Shared\Infrastructure\Bus\Query\InMemoryQueryBus:
        arguments:
            $queryHandlers: !tagged_iterator app.query_handler

    App\Shared\Infrastructure\Bus\Event\InMemoryEventBus:
        arguments:
            $subscribers: !tagged_iterator app.domain_event_subscriber

    App\Shared\Domain\Bus\Command\CommandBus: '@App\Shared\Infrastructure\Bus\Command\InMemoryCommandBus'
    App\Shared\Domain\Bus\Query\QueryBus: '@App\Shared\Infrastructure\Bus\Query\InMemoryQueryBus'
    App\Shared\Domain\Bus\Event\EventBus: '@App\Shared\Infrastructure\Bus\Event\InMemoryEventBus'
    App\Catalog\Product\Domain\ProductRepository: '@App\Catalog\Product\Infrastructure\Persistence\DoctrineProductRepository'
